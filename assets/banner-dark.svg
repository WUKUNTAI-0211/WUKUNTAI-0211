<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" width="1120" height="320" role="img" aria-label="Kun-Tai Wu, LLM inference routing, vLLM Semantic Router maintainer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0d1a"/><stop offset="1" stop-color="#171a3d"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect x="1" y="1" width="1118" height="318" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1120" height="320" fill="url(#bg)"/>
  <rect x="460" width="660" height="320" fill="url(#dots)"/>
  <line x1="480" y1="52" x2="1090" y2="52" stroke="#3b3f6e" stroke-width="1"/>
  <line x1="480" y1="268" x2="1090" y2="268" stroke="#3b3f6e" stroke-width="1"/>
</g>
<rect x="1" y="1" width="1118" height="318" rx="18" fill="none" stroke="#2a2e55" stroke-width="1.5"/>

<!-- identity -->
<rect x="52" y="74" width="30" height="3" rx="1.5" fill="#a78bfa"/>
<text x="50" y="144" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f1f0ff" letter-spacing="-0.5">Kun-Tai Wu</text>
<text x="52" y="186" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#c4b5fd">LLM Inference Routing</text>
<text x="52" y="226" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8b8fb5">Maintainer · vLLM Semantic Router</text>
<text x="52" y="250" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8b8fb5">Associate Researcher · Delta Electronics</text>

<!-- wiring -->
<text x="500" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#8b8fb5" letter-spacing="1.5">REQUEST</text>
